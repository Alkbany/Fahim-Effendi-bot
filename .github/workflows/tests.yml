name: Tests

on:
  push:
    branches:
      - main
      - feature/deterministic-relationship-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  container-build:
    name: Docker image build and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          printf 'DISCORD_TOKEN=test\nGEMINI_API_KEY=test\nMONGO_URI=mongodb://localhost:27017\n' > .env
          docker compose config --quiet

      - name: Build container image
        run: docker build --tag fahim-effendi-bot:test .
