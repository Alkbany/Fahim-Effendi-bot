services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: fahim-lavalink
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-fahim-local-node-password}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"

  fahim:
    build:
      context: .
    container_name: fahim-effendi-bot
    restart: unless-stopped
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MONGO_URI: ${MONGO_URI:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      FAHIM_CHANNEL_ID: ${FAHIM_CHANNEL_ID:-1320069245232742588}
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-fahim-local-node-password}
    depends_on:
      - lavalink
    stop_grace_period: 30s
